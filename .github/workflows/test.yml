name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests and mock smoke
        run: python -m pytest -q
      - name: Mock smoke via the CLI
        run: python -m local_agent smoke --mock
